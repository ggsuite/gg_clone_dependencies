name: gg_clone_dependencies
description: Tool that clones all dependencies of a dart project to the current workspace
version: 1.1.1
repository: https://github.com/inlavigo/gg_clone_dependencies.git

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  path: ^1.9.1
  args: ^2.7.0
  gg_console_colors: ^2.4.0
  gg_process: ^1.2.0
  gg_args: ^3.1.0
  gg_log: ^1.1.0
  gg_local_package_dependencies: ^4.1.0
  gg_project_root: ^2.1.0
  pubspec_parse: ^1.5.0
  yaml: ^3.1.3
  mocktail: ^1.0.5
  http: ^1.6.0

dev_dependencies:
  gg_capture_print: ^1.1.0
  lints: ^6.1.0
  test: ^1.31.2

executables:
  gg_clone_dependencies: